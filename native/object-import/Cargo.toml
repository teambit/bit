[package]
name = "bit-object-import"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
sha1 = "0.10"
rayon = "1.11"
ryu-js = "=1.0.3"
regress = "=0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_os = "linux")'.dependencies]
xattr = "1.6.1"

[lints]
workspace = true
