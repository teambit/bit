name: Rust

# The Rust CLI (`native/`): formatting, Clippy, the perfectionist lints, rustdoc,
# the workspace tests on every platform the CLI targets, and the ported e2e cases.
on:
  push:
    branches: [master, rust-workspace-materialization]
    paths:
      - 'native/**'
      - 'scripts/rust/**'
      - 'scopes/harmony/testing/load-aspect/core-aspects-ids.json'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/rust/**'
      - 'scopes/harmony/testing/load-aspect/core-aspects-ids.json'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; every pushed commit keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: pnpm Rust formatting and lints
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Cache Cargo and formatter artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.dylint_drivers
            ~/.cache/pnpm/rustfmt
            native/target/debug
          key: rust-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml', 'native/Cargo.lock', 'native/Cargo.toml', 'scripts/rust/rustfmt.json') }}-dylint-6.0.4
          # Keeps the installed Dylint binaries and registry when only the lockfile changes.
          restore-keys: rust-lint-${{ runner.os }}-
      - name: Cache pinned perfectionist library
        uses: actions/cache@v4
        with:
          path: native/target/dylint
          key: rust-perfectionist-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml', 'native/dylint.toml') }}-dylint-6.0.4
      - name: Install pinned Rust and Clippy
        run: |
          rustup show
          rustup component add clippy
      - name: Check pnpm's pinned formatter
        run: node ../scripts/rust/rustfmt.mjs --all -- --check
      - name: Prepare pinned pnpm engine sources
        run: node ../scripts/rust/prepare-pnpm-engine.mjs
      - name: Check Clippy
        run: cargo clippy --locked --workspace --all-targets --features bit-cli/e2e -- -D warnings
      - name: Install pnpm's Dylint version
        run: |
          if ! cargo dylint --version 2>/dev/null | grep -Fxq 'cargo-dylint 6.0.4' || ! command -v dylint-link >/dev/null; then
            cargo install --locked --force --version 6.0.4 cargo-dylint dylint-link
          fi
      - name: Check perfectionist
        env:
          RUSTFLAGS: '-D warnings'
        run: cargo dylint --all -- --all-targets --workspace --features bit-cli/e2e
      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --locked --workspace --no-deps
      - name: Check that the e2e porting plan lists every e2e case
        run: node ../scripts/rust/e2e-port-plan.mjs --check

  test:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 90 || 60 }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target/debug
          key: rust-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml', 'native/Cargo.lock') }}
          restore-keys: rust-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned Rust
        run: rustup show
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Prepare pinned pnpm engine sources
        run: node ../scripts/rust/prepare-pnpm-engine.mjs
      - name: Test the workspace
        run: cargo test --locked --workspace

  e2e:
    # The e2e cases ported to the native CLI (native/plans/TEST_PORTING.md), with the
    # released Node.js CLI that cli/tests/e2e/bit-version names behind it.
    name: Ported e2e cases
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the pinned Node.js CLI version
        id: bit
        run: echo "version=$(tr -d '[:space:]' < cli/tests/e2e/bit-version)" >> "$GITHUB_OUTPUT"
      - name: Cache dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target/debug
          key: rust-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml', 'native/Cargo.lock') }}
          restore-keys: rust-e2e-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache the Node.js CLI
        id: bvm-cache
        uses: actions/cache@v4
        with:
          path: ~/.bvm/versions/${{ steps.bit.outputs.version }}
          key: bvm-bit-${{ runner.os }}-${{ runner.arch }}-${{ steps.bit.outputs.version }}
      - name: Install pinned Rust
        run: rustup show
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Install the Node.js CLI
        if: steps.bvm-cache.outputs.cache-hit != 'true'
        # Outside native/, whose package.json pins pnpm as the package manager.
        working-directory: ${{ runner.temp }}
        env:
          BIT_VERSION: ${{ steps.bit.outputs.version }}
        run: |
          npx -y @teambit/bvm@3.1.4 config set RELEASE_TYPE nightly
          npx -y @teambit/bvm@3.1.4 install "$BIT_VERSION" --skip-update-path
      - name: Prepare pinned pnpm engine sources
        run: node ../scripts/rust/prepare-pnpm-engine.mjs
      - name: Run the ported e2e cases
        run: cargo test --locked -p bit-cli --features e2e --test e2e

  status-diff-windows:
    name: Workspace VCS parity (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set the BVM cache directory
        run: echo "BVM_GLOBALS_DIR=$RUNNER_TEMP/bit-bvm" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Read the pinned Node.js CLI version
        id: bit
        run: echo "version=$(tr -d '[:space:]' < cli/tests/e2e/bit-version)" >> "$GITHUB_OUTPUT"
      - name: Cache dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target/debug
          key: rust-status-diff-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml', 'native/Cargo.lock') }}
          restore-keys: |
            rust-status-diff-${{ runner.os }}-${{ runner.arch }}-
            rust-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache the Node.js CLI
        id: bvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BVM_GLOBALS_DIR }}/versions/${{ steps.bit.outputs.version }}
          key: bvm-status-diff-${{ runner.os }}-${{ runner.arch }}-${{ steps.bit.outputs.version }}
      - name: Install pinned Rust
        run: rustup show
      - name: Install the Node.js CLI
        if: steps.bvm-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        env:
          BIT_VERSION: ${{ steps.bit.outputs.version }}
        run: |
          npx -y @teambit/bvm@3.1.4 config set RELEASE_TYPE nightly
          npx -y @teambit/bvm@3.1.4 install "$BIT_VERSION" --skip-update-path
      - name: Prepare pinned pnpm engine sources
        run: node ../scripts/rust/prepare-pnpm-engine.mjs
      - name: Compare native workspace VCS with the pinned Node.js CLI
        run: |
          parity_failed=0
          for parity_filter in \
            diff_completion status_completion status_component_policy status_environments status_relative \
            status_component_selectors status_graph_remote status_autosync \
            commands::snap commands::tag snapshot_environments; do
            if ! cargo test --locked -p bit-cli --features e2e --test e2e "$parity_filter" -- --nocapture; then
              parity_failed=1
            fi
          done
          exit "$parity_failed"
