# Custom merge queue — see .github/scripts/merge-queue.js for the full design.
#
# Event-driven with a scheduled safety net (the loop is stateless, so a missed event costs one
# cycle at most):
# - pull_request_target: instant reaction to joining/leaving the queue and pushes to queued PRs.
#   Deliberately NOT pull_request — that would execute the PR branch's copy of this workflow and
#   script with CIRCLE_TOKEN in the environment, letting any same-repo PR exfiltrate the secret.
#   pull_request_target runs master's workflow definition, and the checkout below pins ref: master,
#   so PR-controlled code never runs here.
# - push to master: the merge itself and, more importantly, the bump commit landing near the end
#   of bit_merge. That run still sees bit_merge finishing, so the actual turn handoff lands on the
#   next scheduled cycle a few minutes later — an accepted trade-off for keeping CircleCI
#   oblivious to the queue.
# - schedule: safety net, and the turn-handoff mechanism per the above.
name: merge-queue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'reconcile without mutating anything (no statuses, no branch updates, no dashboard writes)'
        type: boolean
        default: false
  push:
    branches: [master]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, auto_merge_enabled, auto_merge_disabled]

# never let two reconcile loops overlap; a queued run supersedes waiting duplicates
concurrency:
  group: merge-queue
  cancel-in-progress: false

permissions:
  # contents: write is for the update-branch API (master's strict up-to-date protection means the
  # bot must press "Update branch" on the queue head, or the queue starves after every bump commit)
  contents: write
  statuses: write
  issues: write
  pull-requests: read

jobs:
  reconcile:
    if: github.repository == 'teambit/bit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # always run the trusted master copy of the script, never a branch's copy
          ref: master
          sparse-checkout: .github
      - name: reconcile merge queue
        run: node .github/scripts/merge-queue.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CIRCLE_TOKEN: ${{ secrets.CIRCLE_TOKEN }}
          MERGE_QUEUE_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'true' || 'false' }}
